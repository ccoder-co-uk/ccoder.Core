name: ccoder-core

x-ccoder-environment: &ccoder-environment
  ASPNETCORE_ENVIRONMENT: Development
  CoreData__ConnectionString: &core-connection-string Server=sqlserver,1433;Database=cCoder-Core;User Id=sa;Password=${CCODER_SQL_PASSWORD:?Run Docker/ci/Initialize.ps1};Encrypt=True;TrustServerCertificate=True
  SecurityData__ConnectionString: &security-connection-string Server=sqlserver,1433;Database=cCoder-SSO;User Id=sa;Password=${CCODER_SQL_PASSWORD:?Run Docker/ci/Initialize.ps1};Encrypt=True;TrustServerCertificate=True
  Security__DecryptionKey: ${CCODER_DECRYPTION_KEY:?Run Docker/ci/Initialize.ps1}
  Eventing__ProviderType: Http
  Eventing__Http__HubUrl: http://localhost:5100
  ContentManagement__WorkflowServiceUrl: http://workflow:800/api/
  Workflow__ServiceUrl: http://workflow:800/api/
  Workflow__ExecutionToken: ${CCODER_WORKFLOW_EXECUTION_TOKEN:?Set a shared worker execution token}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CCODER_SQL_PASSWORD:?Run Docker/ci/Initialize.ps1}
    ports:
      - "${CCODER_SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  workflow:
    image: ghcr.io/ccoder-co-uk/ccoder-core-workflow:latest
    networks: [workflow-transport]
    environment:
      ASPNETCORE_URLS: http://+:800
      Workflow__ExecutionToken: ${CCODER_WORKFLOW_EXECUTION_TOKEN:?Set a shared worker execution token}
      Workflow__TrustedWebOrigins: ${CCODER_WORKFLOW_TRUSTED_WEB_ORIGINS:?Set the approved HTTPS Web origins}
    ports:
      - "127.0.0.1:${CCODER_WORKFLOW_HTTP_PORT:-800}:800"

  application:
    image: ghcr.io/ccoder-co-uk/ccoder-core-application:latest
    networks: [default, workflow-transport]
    environment:
      <<: *ccoder-environment
      CCODER_WEB_URLS: http://+:80;https://+:443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/ccoder-localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CCODER_HTTPS_PASSWORD:?Run Docker/ci/Initialize.ps1}
    depends_on:
      sqlserver:
        condition: service_healthy
      workflow:
        condition: service_started
    ports:
      - "${CCODER_WEB_HTTP_PORT:-80}:80"
      - "${CCODER_WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./.https/ccoder-localhost.pfx:/https/ccoder-localhost.pfx:ro

networks:
  workflow-transport:

volumes:
  sql-data:
