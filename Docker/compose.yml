name: ccoder-core

x-core-environment: &core-environment
  ASPNETCORE_ENVIRONMENT: Development
  CoreData__ConnectionString: ${CCODER_CORE_CONNECTION_STRING:?Set CCODER_CORE_CONNECTION_STRING in Docker/.env}
  SecurityData__ConnectionString: ${CCODER_SECURITY_CONNECTION_STRING:?Set CCODER_SECURITY_CONNECTION_STRING in Docker/.env}
  Security__DecryptionKey: ${CCODER_DECRYPTION_KEY:?Run Docker/Initialize.ps1}
  Eventing__ProviderType: Http
  Eventing__Http__HubUrl: http://localhost:5100
  ContentManagement__WorkflowServiceUrl: http://workflow:800/api/
  Workflow__ServiceUrl: http://workflow:800/api/
  Workflow__ExecutionToken: ${CCODER_WORKFLOW_EXECUTION_TOKEN:?Set a shared worker execution token}

services:
  workflow:
    image: ghcr.io/ccoder-co-uk/ccoder-core-workflow:latest
    pull_policy: always
    networks: [workflow-transport]
    environment:
      ASPNETCORE_URLS: http://+:800
      Workflow__ExecutionToken: ${CCODER_WORKFLOW_EXECUTION_TOKEN:?Set a shared worker execution token}
      Workflow__TrustedWebOrigins: ${CCODER_WORKFLOW_TRUSTED_WEB_ORIGINS:?Set the approved HTTPS Web origins}
    ports:
      - "127.0.0.1:${CCODER_WORKFLOW_HTTP_PORT:-800}:800"

  application:
    image: ghcr.io/ccoder-co-uk/ccoder-core-application:latest
    pull_policy: always
    networks: [default, workflow-transport]
    environment:
      <<: *core-environment
      CCODER_WEB_URLS: http://+:80;https://+:443
      CCODER_GENERATE_LOCAL_CERTIFICATE: "true"
      CCODER_CERTIFICATE_PATH: /https/ccoder-localhost.crt
      CCODER_CERTIFICATE_KEY_PATH: /https/ccoder-localhost.key
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/ccoder-localhost.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /https/ccoder-localhost.key
    ports:
      - "${CCODER_WEB_HTTP_PORT:-80}:80"
      - "${CCODER_WEB_HTTPS_PORT:-443}:443"
    volumes:
      - local-https:/https
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  workflow-transport:

volumes:
  local-https:
