# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/nuget
  APPLICATION_DIRECTORY: ${{ github.workspace }}/artifacts/applications
  TEST_RESULTS_DIRECTORY: ${{ github.workspace }}/artifacts/test-results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-test-pack:
    runs-on: [self-hosted, Windows, X64, test]
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          path: ccoder.Core

      - name: Create version number
        id: version
        run: |
          "value=$(Get-Date -Format 'yyyy.M.d.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ccoder.Core/src/cCoder.Core.FrontEnd/package-lock.json

      - name: Restore
        run: dotnet restore ccoder.Core/src/cCoder.Core.slnx --source https://api.nuget.org/v3/index.json --no-http-cache

      - name: Build
        run: dotnet build ccoder.Core/src/cCoder.Core.slnx -c Release --no-restore -m /p:BuildInParallel=true /p:UseSharedCompilation=true /p:Version="${{ steps.version.outputs.value }}"

      - name: Test frontend
        working-directory: ccoder.Core/src/cCoder.Core.FrontEnd
        run: npm test

      - name: Test with coverage
        run: |
          & ccoder.Core/.github/workflows/Invoke-Tests.ps1 `
            -RepositoryRoot "${{ github.workspace }}/ccoder.Core" `
            -SettingsPath "${{ github.workspace }}/ccoder.Core/src/cCoder.Core.coverage.runsettings" `
            -ResultsDirectory "${{ env.TEST_RESULTS_DIRECTORY }}" `
            -CollectCoverage

      - name: Enforce services and exposures coverage
        run: |
          $coverageFiles = @(
            Get-ChildItem "${{ env.TEST_RESULTS_DIRECTORY }}" -Recurse -Filter coverage.cobertura.xml
          )

          if ($coverageFiles.Count -eq 0) {
            throw 'No Cobertura coverage reports were produced.'
          }

          $lines = @{}

          foreach ($coverageFile in $coverageFiles) {
            [xml] $coverage = Get-Content -LiteralPath $coverageFile.FullName

            foreach ($class in $coverage.coverage.packages.package.classes.class) {
              $sourceFile = ([string] $class.filename).Replace('\', '/')
              $sourceFile = $sourceFile -replace '^cCoder\.Core/', ''

              if ($sourceFile -notmatch '(^|/)(Services|Exposures)/') {
                continue
              }

              foreach ($line in $class.lines.line) {
                $key = "$sourceFile|$($line.number)"

                if (-not $lines.ContainsKey($key)) {
                  $lines[$key] = 0
                }

                if ([int] $line.hits -gt 0) {
                  $lines[$key] = 1
                }
              }
            }
          }

          if ($lines.Count -eq 0) {
            throw 'No service or exposure source lines were found in the coverage reports.'
          }

          $coveredLines = @($lines.Values | Where-Object { $_ -eq 1 }).Count
          $lineRate = $coveredLines / $lines.Count
          $percentage = $lineRate.ToString('P3')

          "Services and exposures line coverage: $coveredLines/$($lines.Count) ($percentage)" |
            Write-Output

          if ($lineRate -le 0.90) {
            throw "Services and exposures line coverage must be greater than 90%; actual: $percentage."
          }

      - name: Pack
        run: |
          if (Test-Path -LiteralPath "${{ env.NUGET_DIRECTORY }}") {
            Remove-Item -LiteralPath "${{ env.NUGET_DIRECTORY }}" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "${{ env.NUGET_DIRECTORY }}" -Force | Out-Null
          dotnet pack ccoder.Core/src/cCoder.Core/cCoder.Core.csproj -c Release --no-build --no-restore --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"

      - name: Publish applications
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          & ccoder.Core/.github/workflows/Publish-Applications.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -OutputRoot "${{ env.APPLICATION_DIRECTORY }}" `
            -Commit "${{ github.sha }}" `
            -NoBuild

      - name: Upload package artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NUGET_DIRECTORY }}/*.nupkg
            !${{ env.NUGET_DIRECTORY }}/*.snupkg

      - name: Upload application artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: applications
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.APPLICATION_DIRECTORY }}/publish/latest

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.TEST_RESULTS_DIRECTORY }}

  publish-nuget:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Filter *.nupkg)) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  coverage-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download test and coverage results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path tools --version 5.5.10

      - name: Generate coverage report
        run: |
          tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          touch coverage-report/.nojekyll

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
          path: coverage-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-report

      - name: Publish coverage site
        id: deployment
        uses: actions/deploy-pages@v4