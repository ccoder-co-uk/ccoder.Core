# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: code-coverage

on:
  workflow_run:
    workflows:
      - publish
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download test and coverage results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path tools --version 5.5.10

      - name: Generate coverage report
        run: |
          tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          touch coverage-report/.nojekyll

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
          path: coverage-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-report

      - name: Publish coverage site
        id: deployment
        uses: actions/deploy-pages@v4
